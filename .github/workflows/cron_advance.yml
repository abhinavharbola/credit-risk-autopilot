name: Advance pipeline clock

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  advance:
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-clock-advance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight - verify DVC setup is actually complete
        run: |
          if [ ! -d .dvc ]; then
            echo "::error::.dvc/ directory not found in this repo checkout."
            echo "See README.md 'Getting started' for the one-time DVC setup."
            exit 1
          fi
          for f in data/processed/pretrain_batches.pkl.dvc data/processed/training_pool.pkl.dvc data/processed/holdout.pkl.dvc; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. Run scripts/run_demo_loop.py, then dvc add and commit the processed data."
              exit 1
            fi
          done
          if [ -z "${{ secrets.DVC_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.DVC_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::DVC_ACCESS_KEY_ID and/or DVC_SECRET_ACCESS_KEY repo secrets are not set."
            exit 1
          fi
          echo "DVC setup looks complete, proceeding to pull."

      - name: Pull versioned data
        run: dvc pull
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_SECRET_ACCESS_KEY }}

      - name: Advance clock and run one tick
        run: python scripts/advance_clock.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
