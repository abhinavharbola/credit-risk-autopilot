# Primary gate metric: AUC-PR.
# Accuracy is close to useless at ~6.7% positive rate, so gate decisions
# (tolerance-band, dominance, significance) all operate on AUC-PR, not accuracy.
primary_metric: auc_pr

# decision threshold, used for recall/precision reporting alongside AUC-PR
decision_threshold: 0.5

# challenger must be within this band of champion to be considered "not worse"
# before the dominance/significance checks decide promotion
tolerance_band: 0.01

# Significance check on matched champion/challenger predictions over the
# identical newly-labeled batch: a paired bootstrap CI directly on the
# primary_metric delta, unconditionally (src/gate/evaluate.py). This used to
# route through McNemar's test (on 0.5-threshold hard-label agreement)
# whenever a batch had enough discordant pairs, but McNemar and the primary
# metric (AUC-PR, threshold-free) answer different statistical questions -
# a challenger could pass one and fail the other for reasons that have
# nothing to do with real generalization. The bootstrap CI on the metric
# delta is now the only test that gates promotion, at every sample size.
significance_alpha: 0.05

# McNemar is still computed every gate evaluation and reported under
# details["mcnemar_*"] as a diagnostic (useful context: did the two models'
# hard-label predictions actually diverge), but it no longer decides
# passed_significance. This threshold is what details["mcnemar_reliable"]
# is judged against - below it, McNemar's own diagnostic number shouldn't be
# trusted either, since ~200 rows and ~13 positives per batch frequently
# doesn't produce enough discordant pairs for McNemar to have real power.
mcnemar_min_discordant_pairs: 15
bootstrap_resamples: 2000

# rollback: live-window vs stored reference-window comparison (4.1)
rollback_metric_drop_threshold: 0.03

# Evidently drift share (fraction of the 10 features individually flagged
# drifted, each at K-S p<0.05). Used ONLY for the retrain trigger: is the
# live batch itself drifted against the training reference.
#
# 0.1 (1 of 10 columns) is too low: with 10 independent per-column tests at
# alpha=0.05 and no multiple-testing correction, P(at least one column
# spuriously flags) = 1 - 0.95^10 ~= 40% on a batch with zero real drift.
# 0.3 (3+ of 10 columns) drops that false-positive rate to ~1% (binomial,
# P(X>=3) with n=10, p=0.05), while still reliably catching real injected
# drift: persistent drift alone touches 3 columns, the concept-drift window
# touches 5.
retrain_drift_share_threshold: 0.3

# 4.1 rollback-reference staleness check: how much the stored reference
# window's overall drift_share is allowed to move away from live traffic's
# drift_share before the reference is considered no longer apples-to-apples
# and the rollback comparison is suppressed. Same numeric default as the
# retrain threshold above (both operate on drift_share, so 0.3 is a
# reasonable starting point for either), but kept as an independent key -
# this is a level-vs-level question, not "is the batch drifted."
staleness_drift_share_delta_threshold: 0.3

# Same staleness check, but on individual column K-S p-values rather than
# the aggregate drift_share. This is a different unit (a p-value delta, not
# a share of columns) and was previously conflated with the two thresholds
# above under one shared config key - kept separate on purpose so tuning
# one never silently changes the others.
staleness_column_pvalue_delta_threshold: 0.3
